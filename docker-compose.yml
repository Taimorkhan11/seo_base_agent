version: "3.9"

services:
  api:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      DATABASE_URL: sqlite:///dev.db
    volumes:
      # Mount source so edits are reflected without rebuild
      - .:/app
      # Persist the SQLite database file across container restarts
      - db_data:/app/instance
    restart: unless-stopped

  # ── Optional: swap SQLite for PostgreSQL ────────────────────────────────────
  # Uncomment the block below and set DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_visibility
  #
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ai_visibility
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  db_data:
  # postgres_data:
